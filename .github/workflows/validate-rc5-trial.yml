name: SAT Channel Manager RC5 Trial Validation (NO RELEASE)
on:
  push:
    branches:
      - feature/rc5-trial-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate RC4.1 baseline, safety and Easy/Neo UI
        run: python3 -m unittest discover -s tests -p 'test_rc5_*.py' -v
      - name: Build isolated RC5 Trial IPK (NO INSTALL)
        run: |
          python3 scripts/build-rc5-trial.py
          test -s rc5-trial.ipk
          ar p rc5-trial.ipk control.tar.gz | tar -xzOf - ./control | grep -Fx 'Version: 0.5.0-rc5-trial'
          for name in neo.py plugin.py core.py ui_skin.py; do
            ar p rc5-trial.ipk data.tar.gz | tar -tzf - | grep -F "/SATChannelManager/$name"
          done
          ar p rc5-trial.ipk data.tar.gz | tar -tzf - | grep -F "/SATChannelManager/RC5-TRIAL-HOLD.txt"
      - name: Verify installed Vu+ icon locations inside the RC5 package
        shell: bash
        run: |
          set -euo pipefail
          ar p rc5-trial.ipk data.tar.gz | tar -xzOf - ./usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/ui_skin.py > /tmp/satcm-rc5-ui.py
          grep -F '/usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/icons/install.png' /tmp/satcm-rc5-ui.py
          grep -F '/usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/icons/bouquets.png' /tmp/satcm-rc5-ui.py
          grep -F '/usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/icons/options.png' /tmp/satcm-rc5-ui.py
          ! grep -F '/tmp/satcm-rc5-build-' /tmp/satcm-rc5-ui.py
      - name: Run public Vu+ build/bootstrap script without installing
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/receiver-rc5-trial.sh --build-only
          test -s /tmp/satcm-rc5-trial.ipk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a = Path('rc5-trial.ipk').read_bytes()
          b = Path('/tmp/satcm-rc5-trial.ipk').read_bytes()
          assert a == b, 'Receiver bootstrap generated a different IPK'
          print('PASS remote receiver bootstrap byte-for-byte equals local RC5 trial')
          print('SHA256:', hashlib.sha256(a).hexdigest())
          PY
      - name: Verify untouched stable install path
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- install.sh packages CHANGELOG.md
          echo "PASS: main installer, shipped RC4.1 IPK and release notes remain unchanged"
      - name: Keep RC5 Trial artifact for offline inspection (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: SAT-Channel-Manager-Pro-RC5-TRIAL-NO-INSTALL
          path: rc5-trial.ipk
          retention-days: 3
          if-no-files-found: error
