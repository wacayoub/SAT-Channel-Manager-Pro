name: SAT Channel Manager RC5 Trial Validation (NO RELEASE)
on:
  push:
    branches:
      - feature/rc5-trial-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate RC4.1 baseline, safety and Easy/Neo UI
        run: python3 -m unittest discover -s tests -p 'test_rc5_*.py' -v
      - name: Test genuine remote Enigma2 service source (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from service_sources_rc5 import download_service_catalog, source_status
          online = download_service_catalog()
          report = source_status((-70, 130, 192, 255, 260), online=online, local={})
          for row in report['rows']:
              print(row['label'], row['online_tv'], 'TV services, nonzero if covered')
          assert report['all_services'] > 10000
          assert report['all_tv'] > 8000
          for row in report['rows']:
              assert row['online_tv'] > 10, row
          print('PASS: real public third-party TV service source works; no receiver writes')
          PY
      - name: Build isolated RC5 Trial IPK (NO INSTALL)
        run: |
          python3 scripts/build-rc5-trial.py
          test -s rc5-trial.ipk
          ar p rc5-trial.ipk control.tar.gz | tar -xzOf - ./control | grep -Fx 'Version: 0.5.1-rc5.1-trial'
          for name in neo.py plugin.py core.py ui_skin.py; do
            ar p rc5-trial.ipk data.tar.gz | tar -tzf - | grep -F "/SATChannelManager/$name"
          done
          ar p rc5-trial.ipk data.tar.gz | tar -tzf - | grep -F "/SATChannelManager/RC5-TRIAL-HOLD.txt"
          ar p rc5-trial.ipk data.tar.gz | tar -tzf - | grep -F "/SATChannelManager/service_sources_rc5.py"
          ar p rc5-trial.ipk data.tar.gz | tar -tzf - | grep -F "/SATChannelManager/service_sources_rc5_ui.py"
          ar p rc5-trial.ipk data.tar.gz | tar -xzOf - ./usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/neo.py | grep -F '_rc5_tv_attach(SATNeoHome)'
      - name: Confirm real RC5 plugin scan pipeline and non-destructive bouquets
        run: python3 scripts/check_rc5_scan_pipeline.py
      - name: Verify installed Vu+ icon locations inside the RC5 package
        shell: bash
        run: |
          set -euo pipefail
          ar p rc5-trial.ipk data.tar.gz | tar -xzOf - ./usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/ui_skin.py > /tmp/satcm-rc5-ui.py
          grep -F '/usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/icons/install.png' /tmp/satcm-rc5-ui.py
          grep -F '/usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/icons/bouquets.png' /tmp/satcm-rc5-ui.py
          grep -F '/usr/lib/enigma2/python/Plugins/Extensions/SATChannelManager/icons/options.png' /tmp/satcm-rc5-ui.py
          ! grep -F '/tmp/satcm-rc5-build-' /tmp/satcm-rc5-ui.py
      - name: Run public Vu+ build/bootstrap script without installing
        shell: bash
        run: |
          set -euo pipefail
          SATCM_SOURCE_BASE="https://raw.githubusercontent.com/wacayoub/SAT-Channel-Manager-Pro/${GITHUB_SHA}" sh scripts/receiver-rc5-trial.sh --build-only
          test -s /tmp/satcm-rc5-trial.ipk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a = Path('rc5-trial.ipk').read_bytes()
          b = Path('/tmp/satcm-rc5-trial.ipk').read_bytes()
          assert a == b, 'Receiver bootstrap generated a different IPK'
          print('PASS remote receiver bootstrap byte-for-byte equals local RC5 trial')
          print('SHA256:', hashlib.sha256(a).hexdigest())
          PY
      - name: Verify source-diagnostic runs without network or receiver access
        run: |
          python3 -m py_compile scripts/audit-rc5-sources.py
          python3 scripts/audit-rc5-sources.py
      - name: Verify untouched stable install path
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main -- install.sh packages CHANGELOG.md
          echo "PASS: main installer, shipped RC4.1 IPK and release notes remain unchanged"
      - name: Keep RC5 Trial artifact for offline inspection (NOT A RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: SAT-Channel-Manager-Pro-RC5-TRIAL-NO-INSTALL
          path: rc5-trial.ipk
          retention-days: 3
          if-no-files-found: error
